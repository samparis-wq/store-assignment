<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Games' Store| Popular Games</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>GAME STORE</h1>
  <p>The best games at affordable prices</p>
  <input type="text" id="search" placeholder="Search games..." onkeyup="filterGames()">
</header>

<section class="register">
  <h2>Create Account</h2>

  <form id="registerForm">
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="password" id="password" placeholder="Password" required>

    <button type="submit">Register</button>
    <p id="message"></p>
  </form>
</section>

<section id="games" class="grid"></section>


<footer>
  <p>© 2026 GameHub | Data protected under Kenya Data Protection Act (2019)</p>
</footer>

<script src="script.js"></script>
</body>
</html>
